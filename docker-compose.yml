services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: control_tower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: control_tower
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_tower"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
