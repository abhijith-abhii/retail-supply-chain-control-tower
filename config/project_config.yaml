  lead_time_std_days: 1.5
  ordering_cost: 25.0
  holding_rate: 0.25
  cost_to_price_ratio: 0.65
  default_service_level: 0.95
  initial_days_supply: 14
  review_period_days: 7
  lost_sale_penalty_to_price: 0.4
  minimum_order_quantity: 6
  case_pack_size: 6
  baseline_days_cover: 14
  sensitivity_series_limit: 24
dataco:
  filename: DataCoSupplyChainDataset.csv
  profit_source: benefit_per_order
  net_sales_source: order_item_total
  maximum_shipping_days: 90
  aliases: {}
  category_mappings: {}
