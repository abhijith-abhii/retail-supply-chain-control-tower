    type: double
    provenance: simulated
    definition: Assumed initial stock multiplied by estimated unit cost.
  demand_uncertainty_std:
    type: double
    provenance: simulated
    definition: Forecast-error SD used for inventory policy, falling back to raw demand
      SD if unavailable.
  stockout_probability:
    type: double
    provenance: simulated
    definition: Normal lead-time demand tail above initial stock assuming no initial
      incoming POs.
  recommended_order_quantity:
    type: int64
    provenance: simulated
    definition: Larger of EOQ or target shortage, rounded to MOQ/case pack, zero if
      no shortage.
  excess_units:
    type: double
    provenance: simulated
    definition: Positive initial inventory above protection order-up-to target.
  excess_value:
    type: double
    provenance: simulated
    definition: Excess units multiplied by estimated unit cost.
