abc_xyz_segmentation:
  item_id:
    type: string
    provenance: observed
    definition: M5 item natural key; not a DataCo product identifier.
  store_id:
    type: string
    provenance: observed
    definition: M5 store natural key.
  abc:
    type: string
    provenance: derived
    definition: 'Revenue concentration class using prior cumulative share: A <80%,
      B <95%, C remainder.'
  xyz:
    type: string
    provenance: derived
    definition: Variability class based on configured CV thresholds; high zero frequency
      forces Z.
  abc_xyz:
    type: string
    provenance: derived
    definition: Concatenated ABC and XYZ planning segment, e.g. A-X.
  volume_segment:
    type: string
    provenance: derived
    definition: Low/medium/high thirds of training mean-demand percentile rank.
  coefficient_of_variation:
    type: double
    provenance: derived
    definition: Sample demand standard deviation / mean; null for zero mean.
  cumulative_revenue_share:
    type: double
    provenance: derived
    definition: Running revenue contribution in descending revenue order, including
      current pair.
bridge_date_event:
  date_key:
    type: int32
    provenance: derived
    definition: Integer YYYYMMDD key derived from calendar date.
  event_name:
    type: string
    provenance: observed
    definition: First source calendar event name; nullable.
dataco_category_delivery:
  category:
    type: string
    provenance: observed
    definition: Normalized DataCo product category; independent of M5 categories.
  orders:
    type: int64
    provenance: derived
    definition: Distinct order count at the output aggregation grain.
  eligible_orders:
    type: int64
    provenance: derived
    definition: Count of distinct eligible orders, or distinct order-category pairs
      in category output.
  late_orders:
    type: int64
    provenance: derived
    definition: Number of eligible late orders in a segment.
  late_delivery_rate:
    type: double
    provenance: derived
    definition: "Late eligible orders / eligible orders, fraction 0\u20131; null for\
      \ empty denominator."
dataco_delivery_performance:
  order_id:
    type: int64
    provenance: observed
    definition: DataCo business order key; repeated across order lines, not a customer
      identity.
  order_date:
    type: timestamp[ns]
    provenance: observed
    definition: Parsed DataCo order calendar date; time of day discarded.
  shipping_mode:
    type: string
    provenance: observed
    definition: Normalized DataCo shipping service name.
  market:
    type: string
    provenance: observed
    definition: Normalized DataCo market; independent of M5 geography.
  region:
    type: string
    provenance: observed
    definition: Normalized DataCo order region.
  customer_segment:
    type: string
    provenance: observed
    definition: Normalized business customer segment; no personal identity.
  actual_shipping_days:
    type: int64
    provenance: observed
    definition: Source reported actual shipping duration in days; not last-mile scan
      evidence.
  scheduled_shipping_days:
    type: int64
    provenance: observed
    definition: Source promised shipping duration in days.
  delivery_eligible:
    type: bool
    provenance: derived
    definition: "True for valid 0\u2013configured-max shipping durations excluding\
      \ cancelled/suspected-fraud orders."
  late_order:
    type: int64
    provenance: derived
    definition: 1 when actual shipping exceeds scheduled, 0 when on time, null if
      ineligible.
  delay_days:
    type: int64
    provenance: derived
    definition: Signed actual minus scheduled shipping days on eligible orders.
  positive_delay_days:
    type: int64
    provenance: derived
    definition: Maximum of signed delay and zero; null if ineligible.
  date_key:
    type: int64
    provenance: derived
    definition: Integer YYYYMMDD key derived from calendar date.
dataco_monthly:
  period:
    type: timestamp[ns]
    provenance: derived
    definition: Start date of the displayed daily, weekly or monthly aggregate.
  sales:
    type: double
    provenance: observed
    definition: Configured DataCo line net-sales amount; defaults to order_item_total.
  profit:
    type: double
    provenance: observed
    definition: Configured DataCo line benefit amount; defaults to benefit_per_order;
      not repeated alias sum.
  orders:
    type: int64
    provenance: derived
    definition: Distinct order count at the output aggregation grain.
dataco_order_profit:
  order_id:
    type: int64
    provenance: observed
    definition: DataCo business order key; repeated across order lines, not a customer
      identity.
  sales:
    type: double
    provenance: observed
    definition: Configured DataCo line net-sales amount; defaults to order_item_total.
  profit:
    type: double
    provenance: observed
    definition: Configured DataCo line benefit amount; defaults to benefit_per_order;
      not repeated alias sum.
  loss_making_order:
    type: bool
    provenance: derived
    definition: True if sum of valid line profit for a DataCo order is negative.
dataco_profitability:
  order_item_id:
    type: int64
    provenance: observed
    definition: Unique DataCo business order-line key.
  order_id:
    type: int64
    provenance: observed
    definition: DataCo business order key; repeated across order lines, not a customer
      identity.
  order_date:
    type: timestamp[ns]
    provenance: observed
    definition: Parsed DataCo order calendar date; time of day discarded.
  date_key:
    type: int64
    provenance: derived
    definition: Integer YYYYMMDD key derived from calendar date.
  shipping_mode:
    type: string
    provenance: observed
    definition: Normalized DataCo shipping service name.
  market:
    type: string
    provenance: observed
    definition: Normalized DataCo market; independent of M5 geography.
  region:
    type: string
    provenance: observed
    definition: Normalized DataCo order region.
  category:
    type: string
    provenance: observed
    definition: Normalized DataCo product category; independent of M5 categories.
  customer_segment:
    type: string
    provenance: observed
    definition: Normalized business customer segment; no personal identity.
  product_name:
    type: string
    provenance: observed
    definition: Normalized DataCo product label.
  quantity:
    type: int64
    provenance: observed
    definition: Source DataCo order-line quantity.
  sales:
    type: double
    provenance: observed
    definition: Configured DataCo line net-sales amount; defaults to order_item_total.
  profit:
    type: double
    provenance: observed
    definition: Configured DataCo line benefit amount; defaults to benefit_per_order;
      not repeated alias sum.
  invalid_sales_flag:
    type: bool
    provenance: derived
    definition: Negative configured sales or negative quantity; excluded from headline
      profit measures.
  abnormal_profit_flag:
    type: bool
    provenance: derived
    definition: Absolute line profit greater than twice absolute line sales; flag
      only, not automatic deletion.
  profit_margin:
    type: double
    provenance: derived
    definition: Aggregate or line profit / matching sales, depending on table grain;
      undefined at zero sales.
  loss_making_line:
    type: bool
    provenance: derived
    definition: True if a DataCo line has negative configured profit.
dataco_profitability_summary:
  segment:
    type: string
    provenance: derived
    definition: Value of the corresponding segment or summary dimension.
  sales:
    type: double
    provenance: observed
    definition: Configured DataCo line net-sales amount; defaults to order_item_total.
  profit:
    type: double
    provenance: observed
    definition: Configured DataCo line benefit amount; defaults to benefit_per_order;
      not repeated alias sum.
  order_count:
    type: int64
    provenance: derived
    definition: Distinct order count in a profitability group; non-additive across
      categories.
  dimension:
    type: string
    provenance: derived
    definition: Column whose values define a grouped operational output.
  profit_margin:
    type: double
    provenance: derived
    definition: Aggregate or line profit / matching sales, depending on table grain;
      undefined at zero sales.
dataco_shipping_mode_performance:
  dimension:
    type: string
    provenance: derived
    definition: Column whose values define a grouped operational output.
  segment:
    type: string
    provenance: derived
    definition: Value of the corresponding segment or summary dimension.
  total_orders:
    type: int64
    provenance: derived
    definition: Number of orders including ineligible outcomes within a segment.
  eligible_orders:
    type: int64
    provenance: derived
    definition: Count of distinct eligible orders, or distinct order-category pairs
      in category output.
  late_orders:
    type: int64
    provenance: derived
    definition: Number of eligible late orders in a segment.
  late_delivery_rate:
    type: double
    provenance: derived
    definition: "Late eligible orders / eligible orders, fraction 0\u20131; null for\
      \ empty denominator."
  average_delay_days:
    type: double
    provenance: derived
    definition: Mean positive delay across eligible orders, including zero for on-time
      orders.
  average_signed_delay:
    type: double
    provenance: derived
    definition: Mean actual minus scheduled duration across eligible orders; can be
      negative.
  actual_shipping_days:
    type: double
    provenance: observed
    definition: Source reported actual shipping duration in days; not last-mile scan
      evidence.
  scheduled_shipping_days:
    type: double
    provenance: observed
    definition: Source promised shipping duration in days.
demand_forecasts_28d:
  item_id:
    type: string
    provenance: observed
    definition: M5 item natural key; not a DataCo product identifier.
  store_id:
    type: string
    provenance: observed
    definition: M5 store natural key.
  state_id:
    type: string
    provenance: observed
    definition: M5 state code CA, TX or WI.
  category_id:
    type: string
    provenance: observed
    definition: M5 category natural key.
  department_id:
    type: string
    provenance: observed
    definition: M5 department natural key.
  origin:
    type: timestamp[ns]
    provenance: derived
    definition: Last historical date available to the forecast.
  date:
    type: timestamp[ns]
    provenance: observed
    definition: Calendar date represented by the observation or prediction.
  date_key:
    type: int64
    provenance: derived
    definition: Integer YYYYMMDD key derived from calendar date.
  horizon:
    type: int64
    provenance: derived
    definition: Integer number of days after origin.
  model:
    type: string
    provenance: derived
    definition: Forecast or classifier name; different forecast levels must not be
      pooled.
  forecast_units:
    type: double
    provenance: forecast
    definition: Nonnegative model prediction in units for one item-store-date-origin-model.
  scale:
    type: double
    provenance: derived
    definition: Mean squared training first difference after first nonzero sale; undefined
      for constants.
  lower_80:
    type: double
    provenance: forecast
    definition: Lower empirical residual bound for nominal 80% interval, clipped at
      zero and below point.
  upper_80:
    type: double
    provenance: forecast
    definition: Upper empirical residual bound for nominal 80% interval, at least
      point forecast.
  lower_95:
    type: double
    provenance: forecast
    definition: Lower empirical residual bound for nominal 95% interval; not additive
      into portfolio coverage.
  upper_95:
    type: double
    provenance: forecast
    definition: Upper empirical residual bound for nominal 95% interval; not additive
      into portfolio coverage.
